# 在真实的 Linux / Windows / macOS 上测试，并打包 Windows 和 macOS 版。
# 打好的包在每次运行的 Artifacts 里下载。
# pip 用 --prefer-binary：cryptography 新版本没有 Intel Mac 的预编译包，从源码编译会链接
# Homebrew 的 OpenSSL，打包后与 Python 自带的 libssl 同名冲突，程序启动即报错。
name: 测试与打包

on:
  push:
    paths-ignore: ["**.md", "docs/**"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  linux:
    name: Linux 测试
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: 安装依赖
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libpcap0.8 isc-dhcp-client \
            libegl1 libgl1 libxkbcommon0 libfontconfig1 libdbus-1-3
          python -m pip install --prefer-binary -r requirements.txt pytest zstandard
      - name: 单元测试
        run: python -m pytest -q tests --ignore=tests/e2e --ignore=tests/integration
      - name: 网络集成测试（虚拟网线；AF_PACKET / libpcap / 不抓包三种方式）
        run: sudo "$(which python)" -m pytest -q tests/integration

  windows:
    name: Windows 测试与打包
    runs-on: windows-latest
    env:
      PYTHONUTF8: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: 安装依赖
        run: python -m pip install --prefer-binary -r requirements.txt pytest pyinstaller zstandard
      - name: 单元测试
        run: python -m pytest -q tests --ignore=tests/e2e --ignore=tests/integration
      - name: 安装 devcon（创建测试用的环回网卡）
        run: choco install devcon.portable -y --no-progress
        continue-on-error: true
      - name: 真实系统接口测试（管理员）
        run: python tests/platform_smoke.py
      - name: 网络助手日志
        if: always()
        run: Get-Content "$env:ProgramData\AutoRustDesk\helper.log" -ErrorAction SilentlyContinue
      - name: 打包
        run: python packaging/build.py
      - uses: actions/upload-artifact@v4
        with:
          name: AutoRustDesk-windows-x64
          path: dist/*.zip

  macos:
    name: macOS 测试与打包（${{ matrix.arch }}）
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-15
            arch: arm64
          - runner: macos-15-intel
            arch: x86_64
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: 安装依赖
        run: python -m pip install --prefer-binary -r requirements.txt pytest pyinstaller zstandard
      - name: 单元测试
        run: python -m pytest -q tests --ignore=tests/e2e --ignore=tests/integration
      - name: 真实系统接口测试（feth 虚拟网线，root）
        run: sudo "$(which python)" tests/platform_smoke.py
      - name: 网络助手日志
        if: always()
        run: sudo cat /var/run/autorustdesk/helper.log || true
      - name: 打包
        run: python packaging/build.py
      - uses: actions/upload-artifact@v4
        with:
          name: AutoRustDesk-macos-${{ matrix.arch }}
          path: dist/*.zip

  release:
    name: 发布到 Releases（推送 v* 标签时）
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [linux, windows, macos]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true
      - uses: softprops/action-gh-release@v2
        with:
          files: artifacts/*.zip
          generate_release_notes: true
