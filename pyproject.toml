[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "autorustdesk"
version = "0.1.0"
description = "网线直连电脑 B（Ubuntu 20.04），自动组网、离线部署并配置 RustDesk 的一键远控工具"
readme = "README.md"
requires-python = ">=3.8"
dependencies = [
    "PySide6>=6.4",
    "paramiko>=3.0",
    "psutil>=5.9",
]

[project.optional-dependencies]
dev = ["pytest>=7"]

[project.scripts]
autorustdesk = "autorustdesk.__main__:main"

[tool.setuptools.packages.find]
include = ["autorustdesk*"]

[tool.setuptools.package-data]
"autorustdesk.remote" = ["ard_remote.py"]

[tool.pytest.ini_options]
testpaths = ["tests"]
